<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#3b82f6" stroke-width="6" stroke-dasharray="8 12" opacity="0.3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#shieldGrad)" stroke-width="12" opacity="0.85" filter="url(#glow)"/>

  <!-- Cigarette Icon (Split/Stopping Symbol) -->
  <g transform="translate(256, 256)">
    <!-- Smoke trails -->
    <path d="M-40,-80 C-50,-110 -20,-130 -30,-160 C-40,-180 -10,-200 -20,-220" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <path d="M0,-80 C10,-110 -10,-135 10,-165 C20,-185 0,-210 10,-230" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <path d="M40,-80 C30,-105 50,-130 40,-155" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

    <!-- Cigarette Body -->
    <rect x="-80" y="-30" width="160" height="45" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
    <!-- Filter -->
    <rect x="-80" y="-30" width="45" height="45" rx="8" fill="#d97706"/>
    <!-- Burning tip -->
    <rect x="70" y="-30" width="10" height="45" rx="3" fill="url(#flameGrad)" filter="url(#glow)"/>

    <!-- Pulse / Target circle at bottom -->
    <circle cx="0" cy="80" r="32" fill="#10b981" filter="url(#glow)"/>
    <path d="M-12 80 L-4 88 L12 72" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
